<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Shattered Kingdom</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #111, #444);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  #story {
    max-width: 700px;
    margin-bottom: 20px;
    padding: 15px;
    background: rgba(0,0,0,0.6);
    border-radius: 10px;
  }
  .choice-btn {
    display: block;
    margin: 5px 0;
    padding: 10px 15px;
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
  }
  .choice-btn:hover {
    background: #155ab6;
  }
</style>
</head>
<body>

<h1>The Shattered Kingdom</h1>
<div id="story">Loading story...</div>
<div id="choices"></div>

<script>
const story = {
  start: {
    text: "You are Arin at the crossroads of Eldoria. The kingdom lies in ruin. Which path will you take?",
    choices: [
      { text: "Venture into the Dark Forest", next: "dark_forest_help" },
      { text: "Seek the Mountain Hermit", next: "mountain_hermit_solve" },
      { text: "Investigate the Abandoned Village", next: "village_investigate" },
      { text: "Join the Rebel Camp", next: "rebel_attack" }
    ]
  },
  // Dark Forest branch
  dark_forest_help: {
    text: "You help the magical creature and gain a crystal that grants magical powers. Ahead, the forest splits into multiple paths.",
    choices: [
      { text: "Enter the enchanted grove", next: "forest_grove_portal" },
      { text: "Ignore the grove and continue deeper", next: "forest_witch" }
    ]
  },
  forest_grove_portal: {
    text: "You find a glowing portal in the grove.",
    choices: [
      { text: "Step through portal", next: "sky_city" },
      { text: "Ignore portal", next: "forest_witch" }
    ]
  },
  sky_city: {
    text: "You arrive in Sky City. The Guardians ask for help.",
    choices: [
      { text: "Help the Guardians", next: "gain_flying_mount" },
      { text: "Refuse", next: "sky_city_collapse" }
    ]
  },
  gain_flying_mount: {
    text: "The Guardians reward you with a flying mount. You feel empowered for the adventures ahead.",
    choices: [
      { text: "Return to forest", next: "forest_witch" }
    ]
  },
  sky_city_collapse: {
    text: "Sky City collapses around you. You barely escape back to the forest.",
    choices: [
      { text: "Continue deeper", next: "forest_witch" }
    ]
  },
  forest_witch: {
    text: "A forest witch confronts you, cackling. You must choose your approach.",
    choices: [
      { text: "Negotiate with the witch", next: "gain_invisibility_potion" },
      { text: "Fight the witch", next: "find_hidden_treasure" }
    ]
  },
  gain_invisibility_potion: {
    text: "The witch gives you a potion of invisibility. This might help later.",
    choices: [
      { text: "Continue your journey", next: "forest_path_continue" }
    ]
  },
  find_hidden_treasure: {
    text: "You defeat the witch and discover hidden treasure.",
    choices: [
      { text: "Take treasure and continue", next: "forest_path_continue" }
    ]
  },
  forest_path_continue: {
    text: "You continue through the forest, prepared for what lies ahead...",
    choices: [
      { text: "End of demo story (add next branches later)", next: null }
    ]
  },
  // Mountain Hermit branch
  mountain_hermit_solve: {
    text: "The Hermit challenges you with a riddle. You solve it and receive an ancient spellbook.",
    choices: [
      { text: "Use fire spell", next: "hermit_fire_spell" },
      { text: "Use ice spell", next: "hermit_ice_spell" }
    ]
  },
  hermit_fire_spell: {
    text: "You use the fire spell to battle a magical beast in the mountains.",
    choices: [
      { text: "Continue journey", next: "mountain_path_continue" }
    ]
  },
  hermit_ice_spell: {
    text: "You use ice magic to freeze a hidden river, creating a path forward.",
    choices: [
      { text: "Continue journey", next: "mountain_path_continue" }
    ]
  },
  mountain_path_continue: {
    text: "Your journey continues, the Hermit's knowledge aiding your progress...",
    choices: [
      { text: "End of demo story (expand later)", next: null }
    ]
  },
  // Abandoned Village branch
  village_investigate: {
    text: "You explore the abandoned village and find clues in the houses.",
    choices: [
      { text: "Follow clues to haunted crypt", next: "village_crypt" },
      { text: "Ignore clues and move on", next: "village_tower" }
    ]
  },
  village_crypt: {
    text: "The crypt is dark and filled with shadows.",
    choices: [
      { text: "Explore crypt", next: "face_shadow_guardian" },
      { text: "Avoid crypt", next: "underground_tunnel" }
    ]
  },
  face_shadow_guardian: {
    text: "A shadow guardian attacks you! You must fight or escape.",
    choices: [
      { text: "Fight", next: "victory_shadow_guardian" },
      { text: "Escape", next: "escape_shadow_guardian" }
    ]
  },
  victory_shadow_guardian: {
    text: "You defeat the guardian and find an ancient scroll.",
    choices: [
      { text: "Continue journey", next: null }
    ]
  },
  escape_shadow_guardian: {
    text: "You escape, but the scroll is lost. Your journey continues.",
    choices: [
      { text: "Continue journey", next: null }
    ]
  },
  underground_tunnel: {
    text: "You discover a secret underground tunnel and continue your journey.",
    choices: [
      { text: "Continue journey", next: null }
    ]
  },
  village_tower: {
    text: "You reach an old watchtower and meet a wise sage.",
    choices: [
      { text: "Talk to sage", next: null },
      { text: "Ignore sage", next: null }
    ]
  },
  // Rebel Camp branch
  rebel_attack: {
    text: "You join the rebels in an attack, earning their respect and gaining an ally.",
    choices: [
      { text: "Take mission to sabotage enemy siege", next: null },
      { text: "Patrol captured area", next: null }
    ]
  }
};

// Function to show story
function showStory(node) {
  const storyDiv = document.getElementById("story");
  const choicesDiv = document.getElementById("choices");
  
  storyDiv.innerText = node.text;
  choicesDiv.innerHTML = "";

  if (node.choices) {
    node.choices.forEach(choice => {
      if (choice.next !== null) {
        const btn = document.createElement("button");
        btn.classList.add("choice-btn");
        btn.innerText = choice.text;
        btn.onclick = () => showStory(story[choice.next]);
        choicesDiv.appendChild(btn);
      } else {
        const btn = document.createElement("button");
        btn.classList.add("choice-btn");
        btn.innerText = choice.text;
        btn.onclick = () => alert("End of demo branch. Expand story further!");
        choicesDiv.appendChild(btn);
      }
    });
  }
}

// Initialize game
showStory(story.start);
</script>

</body>
</html>
